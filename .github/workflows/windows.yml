name: Windows release build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies and test
        run: |
          python -m pip install -r requirements-build.txt
          python -m pytest -q
      - name: Set up NSIS
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'nsis'
          curl.exe -fLsS --retry 3 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' -o $zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          "RH_NSIS=$folder/nsis-3.13/makensis.exe" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: ./tools/build_windows.ps1 -Makensis $env:RH_NSIS -OutputDir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchHub-Windows-x64
          path: artifacts/release/
          if-no-files-found: error
